[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag"
version = "0.1.0"
description = "Local-first enterprise knowledge-base RAG reference implementation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "httpx>=0.27,<1",
  "markdown-it-py>=3,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "python-frontmatter>=1,<2",
  "PyYAML>=6,<7",
  "tiktoken>=0.7,<1",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
local-qwen3 = [
  "sentence-transformers>=2.7.0",
  "torch",
  "transformers>=4.51.0",
]

[project.scripts]
rag = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
  "local_qwen3: manual local Qwen3 embedding source-hit and threshold gate",
]
